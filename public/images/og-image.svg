<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle ambient glows -->
    <radialGradient id="glow-top-right" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-bottom-left" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0" />
    </radialGradient>
    
    <!-- Badge shadow filter -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a2e" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Base background (Portfolio Warm Off-White) -->
  <rect width="1200" height="630" fill="#f8f7f4" />
  
  <!-- Subtle ambient glow spheres -->
  <rect width="1200" height="630" fill="url(#glow-top-right)" />
  <rect width="1200" height="630" fill="url(#glow-bottom-left)" />

  <!-- Subtle outer border line -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#e8e4de" stroke-width="2" />

  <!-- 1. EXACT Portfolio Hexagon Logo (Scaled & Positioned at Center X: 600) -->
  <g transform="translate(545, 95) scale(1.1)">
    <!-- Exact Polygon from app/icon.svg -->
    <polygon
      points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"
      fill="#6c63ff"
    />
    <!-- Exact 'V' Letter from app/icon.svg -->
    <text
      x="50"
      y="68.5"
      text-anchor="middle"
      fill="#ffffff"
      font-size="48"
      font-weight="bold"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    >V</text>
  </g>

  <!-- 2. Typography: Name -->
  <text
    x="600"
    y="265"
    text-anchor="middle"
    fill="#1a1a2e"
    font-size="52"
    font-weight="800"
    letter-spacing="-1"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  >Vincent Chen</text>

  <!-- 3. Typography: Role / Title -->
  <text
    x="600"
    y="312"
    text-anchor="middle"
    fill="#6c63ff"
    font-size="24"
    font-weight="600"
    letter-spacing="0.5"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  >Full-stack Web Developer</text>

  <!-- 4. Tech Stack Pill Badge -->
  <g transform="translate(375, 345)" filter="url(#card-shadow)">
    <rect width="450" height="52" rx="26" fill="#ffffff" stroke="#e8e4de" stroke-width="1.5" />
    <text
      x="225"
      y="32.5"
      text-anchor="middle"
      fill="#1a1a2e"
      font-size="17"
      font-weight="600"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    >
      MERN Stack <tspan fill="#6c63ff"> • </tspan> Next.js <tspan fill="#6c63ff"> • </tspan> TypeScript
    </text>
  </g>

  <!-- 5. Tagline / Supporting Description -->
  <text
    x="600"
    y="445"
    text-anchor="middle"
    fill="#6b7280"
    font-size="18"
    font-weight="400"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  >Developing clean, performant, and scalable web applications.</text>

  <!-- 6. Divider Accent -->
  <line x1="520" y1="480" x2="680" y2="480" stroke="#e8e4de" stroke-width="2" stroke-linecap="round" />

  <!-- 7. Footer Domain Badge -->
  <g transform="translate(480, 508)">
    <rect width="240" height="40" rx="20" fill="#ede9ff" />
    <text
      x="120"
      y="25.5"
      text-anchor="middle"
      fill="#6c63ff"
      font-size="16"
      font-weight="700"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    >vincentchenn.com</text>
  </g>
</svg>
